<div class="mood">
  <div class="mood__input card">
    <form class="form" id="mood-form">
      <label class="field" for="mood-input">What's going on right now?
        <textarea id="mood-input" rows="2" placeholder="For example: I feel restless and my thoughts are racing…"></textarea>
      </label>
      <div class="form-row">
        <span class="small muted">Enter to open your room · Shift+Enter for a new line</span>
        <button class="prc__btn medium accent fill" id="enter-room">Enter my room</button>
      </div>
    </form>
  </div>

  <div class="mood__result card" id="mood-result" hidden>
    <div class="form-row">
      <span class="tag" id="mood-label">A room for grounding</span>
      <button class="prc__btn small" id="reset-room" type="button">Start over</button>
    </div>
    <h3 id="mood-title">Let's lower the intensity, one minute at a time.</h3>
    <p id="mood-description"></p>
    <div class="mood__music">
      <div><span class="small muted">Music to match</span><strong id="music-title">Calm focus</strong><span class="small muted" id="music-description"></span></div>
      <a class="prc__btn" id="music-link" href="https://music.apple.com/" target="_blank" rel="noopener">Open in Apple Music ↗</a>
    </div>
    <button class="prc__btn medium accent" id="grounding-prompt" type="button">Give me a grounding prompt</button>
    <p class="mood__prompt" id="grounding-text"></p>
  </div>
</div>
