<!-- Shown until js/recovery-tracker.js finds a logged-in user -->
<div class="tracker__gate" id="tracker-gate">
  <div class="note">
    <h3>Log in to use the Recovery Tracker</h3>
    <p id="tracker-gate-text">Your weekly check-ins are saved to your account, so only you can see your trends, from any device.</p>
    <div class="prc__links">
      <a class="prc__btn accent fill" href="/login">Log in</a>
      <a class="prc__btn" href="/signup">Create an account</a>
    </div>
  </div>
</div>

<div id="tracker-app" hidden>
  <div class="tracker">
    <!-- The check-in form opens from this button -->
    <div class="tracker__start">
      <button class="prc__btn medium accent fill" id="tracker-open" type="button" aria-expanded="false" aria-controls="tracker-drawer">+ Add this week's check-in</button>
      <p class="status-msg" id="tracker-status" role="status"></p>
    </div>

    <div class="tracker__drawer" id="tracker-drawer" hidden>
      <form class="form card tracker__form" id="tracker-form" novalidate>
        <div class="form-row">
          <h3 class="card__title">How was your week?</h3>
          <span class="tag" id="tracker-week">This week</span>
        </div>
        <div class="tracker__metrics" id="tracker-metrics"></div>
        <fieldset class="tracker__actions">
          <legend>This week I…</legend>
          <div class="chips" id="tracker-actions"></div>
        </fieldset>
        <label class="field">Note <small>(optional)</small>
          <textarea name="note" maxlength="280" rows="2"></textarea>
        </label>
        <div class="tracker__form-actions">
          <button class="prc__btn medium" id="tracker-cancel" type="button">Cancel</button>
          <button class="prc__btn medium accent fill" type="submit">Save check-in</button>
        </div>
      </form>
    </div>

    <div class="note note--crisis tracker__alert" id="tracker-alert" role="alert" hidden>
      <h3>This week looks really hard</h3>
      <p id="tracker-alert-text"></p>
      <div class="prc__links">
        <a class="prc__btn small accent fill" href="tel:988">Call or text 988</a>
        <button class="prc__btn small" type="button" data-feature="schedule">Find a meeting</button>
      </div>
    </div>

    <h3 class="tracker__heading">Your patterns</h3>
    <div class="tracker__insights" id="tracker-insights"></div>
    <p class="tracker__helps small" id="tracker-helps"></p>
    <div class="tracker__charts" id="tracker-charts"></div>

    <details class="tracker__history" id="tracker-history" hidden>
      <summary>All check-ins</summary>
      <div class="tracker__table-wrap"><table class="tracker__table" id="tracker-table"></table></div>
    </details>
  </div>
</div>
