# Site settings
title: Poway Recovery Center
description: Poway Recovery Center offers programs for people with different addictions and those affected by them, at 13939 and 13943 Poway Rd, Poway, California.

# Every page uses _layouts/default.html (shared header, footer and scripts) unless it sets its own layout
defaults:
  - scope:
      path: ""
    values:
      layout: default

# All styling is Sass: assets/css/main.scss pulls in the partials in _sass/
sass:
  sass_dir: _sass
  style: compressed

# Files Jekyll should not copy into the site (same approach as Open Coding Society pages)
exclude:
# Jekyll defaults
  - vendor
  - Gemfile
  - Gemfile.lock
# Custom excludes
  - Makefile
  - README.md
  - poway-recovery-center-logo.png
