---
title: Log in
scripts: [js/login.js]
---
<section class="auth">
  <div class="auth__card card">
    <h1>Log in</h1>
    <p class="muted">See your reservations and update your details.</p>
    <form class="form" id="login-form">
      <label class="field">Username or email<input type="text" name="uid" required autocomplete="username"></label>
      <label class="field">Password<input type="password" name="password" required minlength="6" autocomplete="current-password"></label>
      <button class="prc__btn large accent fill auth__submit">Log in</button>
      <p class="status-msg is-error" id="login-message" role="status"></p>
    </form>
    <p class="auth__alt">New here? <a href="signup.html">Create an account</a></p>
    <p class="auth__alt small muted">You don't need an account to attend meetings or use the resources. <a href="resources.html">Browse resources</a></p>
  </div>
</section>
